# Sync & Release
#
# Builds and publishes a GitHub release of this fork, with the compiled jar attached, when:
#   - Upstream (PlayPro/CoreProtect) publishes a new release (checked hourly).
#   - Changes are pushed or merged into the default branch of this fork.
#   - The workflow is started manually.
#
# The build source is the upstream release tag. Changes made in this fork (the difference between
# the fork's branch and upstream's default branch, ignoring .github) are applied on top of it.
# Without such changes the build is identical to the upstream release.
# When changes are applied, they are attached to the release as fork-changes.patch.
#
# Upstream release tags are not always part of the history of its default branch, so the tag is
# not merged into the fork's branch. This workflow never modifies the fork's branch.
#
# There is one release per upstream version. Its tag and title follow upstream, and it is
# replaced by each newer build of the same version.
# The jar is named <JAR_NAME_PREFIX>-<tag>.jar, for example CoreProtect-CE-v24.1.jar.
#
# If the fork's changes do not apply to the upstream release, the run fails and the
# conflict has to be resolved manually.

name: Sync & Release

on:
  schedule:
    - cron: '17 * * * *'   # Hourly, at minute 17 (offset from the hour to avoid scheduler delays)
  push:
    branches: [master]     # Default branch of this fork
    # A push is skipped only when every changed file matches one of these patterns.
    # Files that do not affect the compiled jar (documentation, CI configuration, repository metadata).
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Allow only one run at a time so scheduled, pushed and manual runs cannot overlap.
concurrency:
  group: sync-and-release
  cancel-in-progress: false

env:
  UPSTREAM: PlayPro/CoreProtect
  JAVA_VERSION: '25'      # Must match the JDK used by upstream (see its build.yml / pom.xml)
  JAR_NAME_PREFIX: CoreProtect-CE

defaults:
  run:
    shell: bash           # Enables pipefail

jobs:
  # Determines the latest upstream release and whether a build is required.
  # Scheduled runs only build when the fork has not released that version yet.
  # Pushes and manual runs always build.
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      needed: ${{ steps.latest.outputs.needed }}
    steps:
      - name: Determine latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name // empty')

          # The tag is used in git and shell commands later, so restrict it to safe characters.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Unexpected or missing upstream tag: '$TAG'"
            exit 1
          fi

          NEEDED=true
          if [ "$EVENT_NAME" = "schedule" ] \
            && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            NEEDED=false
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $TAG | trigger: $EVENT_NAME | build needed: $NEEDED" | tee -a "$GITHUB_STEP_SUMMARY"

  # Builds the upstream release (plus any changes of this fork), runs the tests, then publishes it.
  release:
    name: Build & release
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Collects the changes of this fork (relative to upstream's default branch), then switches the
      # working tree to the upstream release tag and applies them. Nothing is pushed.
      - name: Prepare source (upstream release plus fork changes)
        id: source
        run: |
          FORK_SHA=$(git rev-parse HEAD)

          DEFAULT_BRANCH=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/upstream/$DEFAULT_BRANCH"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$TAG"
          TAG_SHA=$(git rev-parse "FETCH_HEAD^{commit}")

          BASE=$(git merge-base HEAD "refs/remotes/upstream/$DEFAULT_BRANCH") || {
            echo "::error::This fork shares no history with upstream's $DEFAULT_BRANCH branch"
            exit 1
          }

          PATCH="$RUNNER_TEMP/fork-changes.patch"
          git diff --binary "$BASE" HEAD -- . ':(exclude).github' > "$PATCH"

          git checkout -q --detach "$TAG_SHA"

          MODIFIED=false
          if [ -s "$PATCH" ]; then
            if ! git apply --3way --index "$PATCH"; then
              echo "::error::The changes of this fork do not apply cleanly to upstream $TAG"
              git diff --name-only --diff-filter=U | sed 's/^/::error::Conflict in /'
              exit 1
            fi
            MODIFIED=true
          fi

          # The release tag should point at the upstream commit. If it is not reachable from this
          # repository, fall back to the fork's own commit.
          if gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_SHA" --silent >/dev/null 2>&1; then
            TARGET=$TAG_SHA
          else
            TARGET=$FORK_SHA
          fi

          {
            echo "fork_sha=$FORK_SHA"
            echo "tag_sha=$TAG_SHA"
            echo "target=$TARGET"
            echo "modified=$MODIFIED"
          } >> "$GITHUB_OUTPUT"
          echo "Source: upstream $TAG ($TAG_SHA) | fork changes applied: $MODIFIED"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # Compiles the project and runs the tests. Later steps are skipped if this fails.
      - name: Build and test
        run: mvn -B verify

      # The release title is taken from the upstream release (for example "CoreProtect CE v24.1").
      # The jar is renamed to <JAR_NAME_PREFIX>-<tag>.jar.
      - name: Prepare release files
        id: prep
        env:
          FORK_SHA: ${{ steps.source.outputs.fork_sha }}
          TAG_SHA: ${{ steps.source.outputs.tag_sha }}
          MODIFIED: ${{ steps.source.outputs.modified }}
        run: |
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          [ -n "$JAR" ] || { echo "::error::No jar found in target/"; exit 1; }

          ASSET="$JAR_NAME_PREFIX-$TAG.jar"
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          cp "$JAR" "$DIST/$ASSET"
          ARTIFACTS="$DIST/$ASSET"

          TITLE=$(gh api "repos/$UPSTREAM/releases/tags/$TAG" --jq '.name // empty' | tr -d '\r\n')
          TITLE=${TITLE:-$TAG}

          UPSTREAM_URL="$GITHUB_SERVER_URL/$UPSTREAM"
          SOURCE="Build of upstream release [\`$TAG\`]($UPSTREAM_URL/releases/tag/$TAG) (commit [\`${TAG_SHA:0:7}\`]($UPSTREAM_URL/commit/$TAG_SHA))"
          if [ "$MODIFIED" = "true" ]; then
            cp "$RUNNER_TEMP/fork-changes.patch" "$DIST/fork-changes.patch"
            ARTIFACTS="$ARTIFACTS,$DIST/fork-changes.patch"
            SOURCE="$SOURCE with the changes of this fork applied. The changes are attached as \`fork-changes.patch\` (fork commit [\`${FORK_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$FORK_SHA))."
          else
            SOURCE="$SOURCE."
          fi

          {
            echo "$SOURCE"
            echo
            echo "The changelog is available on the upstream release page."
            echo
            echo "[Build log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · Java $JAVA_VERSION (Temurin) · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$RUNNER_TEMP/notes.md"

          echo "artifacts=$ARTIFACTS" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Release asset: $ASSET (built from $(basename "$JAR"))"

      # Removes the previous release of this version, if any, so it can be replaced by the new build.
      # Also removes a leftover tag (for example one copied from upstream) so the new tag is created
      # on the commit that was built.
      - name: Remove previous release and tag (if present)
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

      - name: Publish release
        id: publish
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.target }}
          name: ${{ steps.prep.outputs.title }}
          bodyFile: ${{ runner.temp }}/notes.md
          artifacts: ${{ steps.prep.outputs.artifacts }}
          makeLatest: true
          token: ${{ github.token }}

      - name: Summary
        run: echo "Released [$TAG](${{ steps.publish.outputs.html_url }})" >> "$GITHUB_STEP_SUMMARY"
